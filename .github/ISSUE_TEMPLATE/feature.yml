name: "功能建议"
description: "新功能，或对现有功能的改进"
labels: ["enhancement"]
body:
- type: textarea
  id: problem
  attributes:
    label: "想解决什么问题"
    description: "现在用起来哪里不方便？说清楚使用场景，比功能本身更重要。"
  validations:
    required: true
- type: textarea
  id: idea
  attributes:
    label: "你的想法"
    description: "你希望它怎么做。如果其他启动器已经有类似的做法，也可以附上截图或链接。"
  validations:
    required: true

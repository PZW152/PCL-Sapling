name: "问题反馈"
description: "启动器出错、游戏启动失败、下载或登录出现问题"
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      这里是 **PCL 樹苗修改版** 的问题反馈。它是第三方修改版，请不要把本修改版的问题反馈到 PCL 原版仓库。
      安装了 Mod 的整合包崩溃，通常是 Mod 之间的问题，可以先看看启动器的崩溃分析给出的原因。
- type: checkboxes
  id: check
  attributes:
    label: "检查项"
    options:
    - label: "我已在 [Issues](https://github.com/PZW152/PCL-Sapling/issues?q=is%3Aissue) 中搜索过，这个问题还没有人提交。"
      required: true
    - label: "我使用的是最新版本的樹苗修改版（设置 → 其他 → 检查更新）。"
      required: true
- type: textarea
  id: what
  attributes:
    label: "发生了什么"
    description: "你做了什么操作，看到了什么，你原本期望看到什么。"
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: "复现步骤"
    description: "按什么步骤操作可以再次遇到这个问题。"
    placeholder: |
      1. 打开……
      2. 点击……
      3. 出现……
- type: textarea
  id: diagnostics
  attributes:
    label: "诊断信息"
    description: "在 设置 → 关于 → 反馈与支持 中点「复制诊断信息」，粘贴到这里。其中不包含账号信息。"
    render: text
  validations:
    required: true
- type: textarea
  id: files
  attributes:
    label: "错误报告与日志"
    description: "游戏崩溃时请上传「导出错误报告」生成的文件；启动器出错时请上传 PCL 文件夹中的 Log1.txt。先点这个文本框，再把文件拖进来。"

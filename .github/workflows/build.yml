name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore/**'
      - 'PCL.Tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore/**'
      - 'PCL.Tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Test
      if: matrix.configuration == 'Debug'
      run: |
        dotnet run --project "PCL.Tests\PCL.Tests.csproj" -c Debug
        dotnet run --project "MeloongCore\Tests\MeloongCore.Tests.csproj" -c Debug

    - name: Build
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        PCL_COMMIT_HASH: ${{ github.sha }}
      run: dotnet build "Plain Craft Launcher 2\Plain Craft Launcher 2.csproj" -c ${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe

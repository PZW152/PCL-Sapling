name: Release
# 推送 v1.2.3 形式的標籤時，建置正式版並發佈到 GitHub Releases。
# 啟動器的自動更新只接受名為 PCL-Sapling-版本號.exe、帶有 SHA-256 摘要（GitHub 自動計算）的檔案。
# 兩個工作：build 只有讀取權限，跑完全部測試後建置並上傳 exe；publish 才有寫入權限，發佈的就是 build 測試過的同一個檔案（#9）。
# 第三方 Action 固定到完整的提交 SHA，升級時一併更新註解中的版本。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Check version
      id: version
      shell: bash
      run: |
        tag="${GITHUB_REF_NAME#v}"
        code=$(grep -oP 'VersionBaseName = "\K[0-9.]+' "Plain Craft Launcher 2/Modules/Base/ModBase.cs")
        if [ "$tag" != "$code" ]; then
          echo "標籤 $GITHUB_REF_NAME 與 ModBase.VersionBaseName ($code) 不一致，否則啟動器會一直提示更新"
          exit 1
        fi
        echo "version=$tag" >> $GITHUB_OUTPUT

    - name: Check secrets
      shell: bash
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CF_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      run: |
        if [ -z "$CLIENT_ID" ]; then
          echo "缺少 CLIENT_ID secret，發佈出去的版本將無法微軟登入，已停止發佈"
          exit 1
        fi
        if [ -z "$CF_KEY" ]; then
          echo "::warning::缺少 CURSEFORGE_API_KEY secret，這個版本只能從 Modrinth 搜尋與下載資源"
        fi

    - name: Test
      run: |
        dotnet run --project "PCL.Tests\PCL.Tests.csproj" -c Debug
        dotnet run --project "MeloongCore\Tests\MeloongCore.Tests.csproj" -c Debug

    - name: Build
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        PCL_COMMIT_HASH: ${{ github.sha }}
      run: dotnet build "Plain Craft Launcher 2\Plain Craft Launcher 2.csproj" -c Release

    - name: Package
      shell: bash
      run: |
        mkdir dist
        cp "Plain Craft Launcher 2/bin/Plain Craft Launcher 2.exe" "dist/PCL-Sapling-${{ steps.version.outputs.version }}.exe"
        sha256sum dist/*.exe

    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-exe
        path: dist/*.exe
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 1

    - name: Download
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: release-exe
        path: dist

    - name: Attest provenance
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      with:
        subject-path: dist/*.exe

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        file="dist/PCL-Sapling-${VERSION}.exe"
        sha=$(sha256sum "$file" | cut -d' ' -f1)
        git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
        notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
        printf '%s\n\nSHA256：`%s`\n\n建置來源：提交 `%s`，由 GitHub Actions 建置並附有建置來源證明，可用 `gh attestation verify PCL-Sapling-%s.exe -R %s` 驗證。\n\n本軟體是第三方基於 PCL 獨立進行二次創作的修改版，並非 PCL 官方版本。\n' "$notes" "$sha" "$GITHUB_SHA" "$VERSION" "$GITHUB_REPOSITORY" > notes.md
        gh release create "$GITHUB_REF_NAME" "$file" --title "PCL 樹苗修改版 ${VERSION}" --notes-file notes.md
